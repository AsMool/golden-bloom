name: Live site check

# Read-only checks on the real site after each Vercel production deploy.
# Can also be started by hand from the Actions tab: with an address it checks that site;
# left empty, it builds this commit and checks it against the real database.
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: Address of the site to check (empty = build this commit and use the real database)
        required: false

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Pick the address
        env:
          GIVEN: ${{ inputs.url || github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
        run: |
          if [ -n "$GIVEN" ]; then
            # a deployment behind Vercel's login page can't be checked from here
            read -r code where <<< "$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "$GIVEN")"
            if [ "$code" = "401" ] || [ "$code" = "403" ] || [[ "$where" == *vercel.com* ]]; then
              echo "::notice::$GIVEN asks for a Vercel login, so it was not checked. Run this workflow by hand with the public address."
              echo "SKIP=1" >> "$GITHUB_ENV"
            fi
            echo "BASE_URL=$GIVEN" >> "$GITHUB_ENV"
          else
            npm run build
            nohup npx vite preview --host 127.0.0.1 --port 4173 --strictPort > preview.log 2>&1 &
            for _ in $(seq 1 60); do curl -sf http://127.0.0.1:4173 > /dev/null && break; sleep 0.5; done
            echo "BASE_URL=http://127.0.0.1:4173" >> "$GITHUB_ENV"
          fi

      - name: Smoke tests
        if: env.SKIP != '1'
        run: |
          echo "Checking $BASE_URL"
          node --test --test-concurrency=1 e2e/smoke.test.mjs
